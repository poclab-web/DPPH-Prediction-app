# Runtime environment for the Streamlit classification app.
# Transitive dependencies are resolved by conda/pip.
name: streamlit_DPPH
channels:
  - anaconda
  - conda-forge
  - defaults
dependencies:
  - python=3.8.20
  - pip=24.2

  # UI
  - streamlit=1.38.0

  # Fingerprints and model inference (tested versions)
  - numpy=1.24.3
  - pandas=2.0.3
  - rdkit=2023.03.3
  - lightgbm=4.5.0
  - scikit-learn=1.3.0
  - scipy=1.10.1
  - joblib=1.4.2

  - pip:
      - streamlit-ketcher==0.0.1
